name: release image

on:
  release:
    types: [published]

concurrency:
  group: release-image-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${RELEASE_TAG#v}"
          test "$version" = "$(node -p 'require("./package.json").version')"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:$version" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run build
      - run: npm test
        env:
          TALLYLAMP_FAKE_CHROME: "1"
      - name: Refuse to replace a published version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          owner, package = os.environ['GITHUB_REPOSITORY'].split('/')
          page = 1
          while True:
              request = urllib.request.Request(
                  f'https://api.github.com/users/{owner}/packages/container/{package}/versions?per_page=100&page={page}',
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      versions = json.load(response)
              except urllib.error.HTTPError as error:
                  if error.code == 404 and page == 1:
                      break
                  raise
              if any(os.environ['RELEASE_VERSION'] in v['metadata']['container']['tags'] for v in versions):
                  raise SystemExit('This version already exists. Publish a new version instead.')
              if len(versions) < 100:
                  break
              page += 1
          PY
      - name: Build the release artifact
        run: |
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$RELEASE_VERSION" \
            --label "org.opencontainers.image.licenses=MIT" \
            --tag "$RELEASE_IMAGE" .
      - name: Test headed Chrome in the release image
        run: |
          docker run --rm --user 1100:1100 \
            --entrypoint /bin/sh \
            -e TALLYLAMP_XVFB=1 -e TALLYLAMP_CHROME_BIN=/usr/bin/google-chrome \
            -v "$PWD/node_modules:/app/node_modules:ro" \
            -v "$PWD/src:/app/src:ro" -v "$PWD/tests:/app/tests:ro" \
            "$RELEASE_IMAGE" \
            -c 'test -x /usr/bin/google-chrome && node --import tsx --test tests/realism.test.ts'
      - name: Test the running release image
        env:
          TALLYLAMP_TEST_URL: http://127.0.0.1:8080
          TALLYLAMP_TEST_SECRET: release-validation-only
        run: |
          docker run --detach --name tallylamp-release-test \
            --publish 127.0.0.1:8080:8080 \
            -e ADMIN_SECRET="$TALLYLAMP_TEST_SECRET" \
            -e TALLYLAMP_PUBLIC_URL="$TALLYLAMP_TEST_URL" \
            -e TALLYLAMP_MAX_BROWSERS=2 \
            "$RELEASE_IMAGE"
          node scripts/check-image.mjs
      - name: Clean up test container
        if: always()
        run: docker rm --force tallylamp-release-test 2>/dev/null || true
      - name: Publish the tested artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$RELEASE_IMAGE"
          docker image inspect "$RELEASE_IMAGE" --format '{{index .RepoDigests 0}}' > image-digest.txt
          cat image-digest.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: image-digest
          path: image-digest.txt

  # Tallylamp Link, the browser extension for linked browsers, rides along as a release asset
  # under a fixed name, so /releases/latest/download/tallylamp-link.zip always resolves. It
  # waits for the image job: a zip should never appear on a release whose server failed its
  # checks. Only this job can write to the release; the image job cannot.
  extension:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Package Tallylamp Link
        run: |
          mkdir -p .pack
          cp -R extension .pack/tallylamp-link
          rm .pack/tallylamp-link/README.md
          (cd .pack && zip -r -X ../tallylamp-link.zip tallylamp-link)
          unzip -l tallylamp-link.zip
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" tallylamp-link.zip --repo "$GITHUB_REPOSITORY"
