<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Shared browser</title>
    <link rel="icon" href="/guest/assets/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/guest/assets/guest.css" />
    <script type="module" src="/guest/assets/guest.js"></script>
  </head>
  <body>
    <header class="bar">
      <div class="who">
        <span class="mark" aria-hidden="true"><svg viewBox="2 2 20 20"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M14.29 3.44a7.4 9 0 0 1 0 17.12"/><path d="M9.71 3.44a7.4 9 0 0 0 0 17.12"/></g><circle cx="12" cy="12" r="3.3" fill="currentColor"/></svg></span>
        <div class="names">
          <h1 id="name">Shared browser</h1>
          <p id="state" class="state" role="status" aria-live="polite">Opening…</p>
        </div>
      </div>
      <div class="actions">
        <button id="take" class="primary" type="button" hidden>Take control</button>
        <button id="give" class="primary" type="button" hidden>Give control back</button>
        <button id="leave" class="quiet" type="button" hidden>Leave</button>
      </div>
    </header>

    <nav id="tools" class="tools" aria-label="Browser controls" hidden>
      <button id="back" type="button" aria-label="Back" title="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg></button>
      <button id="fwd" type="button" aria-label="Forward" title="Forward"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></button>
      <button id="reload" type="button" aria-label="Reload" title="Reload"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg></button>
      <input id="url" type="text" inputmode="url" autocomplete="off" spellcheck="false" placeholder="Type an address and press Enter" aria-label="Address" hidden />
      <button id="newtab" type="button" aria-label="New tab" title="New tab" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>
    </nav>
    <div id="tabs" class="tabs" role="tablist" aria-label="Tabs" hidden></div>

    <section id="welcome" class="welcome" hidden>
      <h2>A browser has been shared with you</h2>
      <p>This link works once. Open it in the browser you want to use, and it stays open there until it expires.</p>
      <button id="open" class="primary" type="button">Open the shared browser</button>
    </section>

    <main class="stagewrap">
      <canvas id="stage" class="stage" tabindex="0" aria-label="The shared browser. Click it, then type."></canvas>
      <div id="overlay" class="overlay"><span id="overlay-orb" class="overlay-orb"></span><p id="overlay-text">Connecting…</p></div>
    </main>

    <p id="notice" class="notice" role="alert" hidden></p>
    <footer class="foot" id="foot"></footer>
  </body>
</html>
