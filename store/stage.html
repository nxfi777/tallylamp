<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tallylamp Link store images</title>
<!--
  The Chrome Web Store images, drawn in a browser so they can be redrawn after the panel
  changes. The side panel in each one is the real extension/panel.html in demo mode, in an
  iframe. Everything around it (the window, the tab strip, the page, the debugging bar) is
  drawn here, because a headless Chrome has no window to photograph. The pages are made-up
  sites on example.com: a store image must not show somebody else's product as ours.

  ?shot=share|shared|pair|sites|handback   1280x800 screenshots
  ?tile=small|marquee                     440x280 and 1400x560 promo tiles
  ?icon=128                               the extension icon, 96px of mark in a 128px square

  scripts/store-assets.mjs loads each one and saves it. Open one in a browser to look at it.
-->
<style>
  :root {
    --bg: #f5f4f2; --line: #e6e3e0; --text: #171514; --muted: #615c58; --lamp: #b8770c;
    --sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --chrome-strip: #dfe3e8; --chrome-line: #dadce0; --chrome-text: #1f1f1f; --chrome-muted: #5f6368;
    --group: #e8710a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font: 14px/1.5 var(--sans); color: var(--text); -webkit-font-smoothing: antialiased; }
  body.shot { width: 1280px; height: 800px; overflow: hidden; background: var(--bg); position: relative; }

  /* Caption: one claim and one line of proof, left-aligned where the eye starts. */
  .caption { position: absolute; left: 56px; top: 42px; right: 300px; }
  .caption h1 { margin: 0; font-size: 36px; line-height: 1.15; font-weight: 650; letter-spacing: -0.025em; }
  .caption p { margin: 10px 0 0; font-size: 18px; line-height: 1.45; color: var(--muted); }
  .brand { position: absolute; right: 56px; top: 50px; display: flex; align-items: center; gap: 9px; font-weight: 600; font-size: 16px; color: var(--muted); }
  .brand img { width: 22px; height: 22px; }

  /* A light Chrome window, cut off by the bottom edge. */
  .window { position: absolute; left: 48px; right: 48px; top: 172px; bottom: -12px; background: #fff; border-radius: 12px 12px 0 0; overflow: hidden;
    box-shadow: 0 0 0 1px rgba(0,0,0,.08), 0 18px 50px rgba(40,30,20,.16); display: flex; flex-direction: column; }
  .strip { height: 42px; background: var(--chrome-strip); display: flex; align-items: flex-end; padding: 0 10px; gap: 2px; flex: none; }
  .dots { display: flex; gap: 8px; align-self: center; margin: 0 14px 0 6px; }
  .dots i { width: 12px; height: 12px; border-radius: 50%; background: #ff5f57; }
  .dots i:nth-child(2) { background: #febc2e; } .dots i:nth-child(3) { background: #28c840; }
  .tab { height: 34px; width: 214px; display: flex; align-items: center; gap: 8px; padding: 0 12px; font-size: 12.5px; color: var(--chrome-text); border-radius: 9px 9px 0 0; position: relative; white-space: nowrap; }
  .tab span { overflow: hidden; text-overflow: ellipsis; }
  .tab.on { background: #fff; }
  .tab.grouped::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: 0; height: 3px; border-radius: 2px; background: var(--group); }
  .tab.on.grouped::after { bottom: auto; top: 0; }
  .chip { align-self: center; margin: 0 4px 0 8px; background: var(--group); color: #fff; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 7px; }
  .fav { width: 16px; height: 16px; border-radius: 4px; flex: none; display: grid; place-items: center; font-size: 10px; font-weight: 700; font-style: normal; color: #fff; }
  .toolbar { height: 46px; display: flex; align-items: center; gap: 14px; padding: 0 14px; border-bottom: 1px solid var(--chrome-line); flex: none; }
  .toolbar svg { width: 18px; height: 18px; color: var(--chrome-muted); flex: none; }
  .omni { flex: 1; height: 34px; border-radius: 17px; background: #f1f3f4; display: flex; align-items: center; padding: 0 16px; font-size: 14px; color: var(--chrome-text); }
  .omni b { font-weight: 400; color: var(--chrome-muted); }
  .ext { position: relative; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; background: #e8eaed; }
  .ext img { width: 18px; height: 18px; }
  .badge { position: absolute; right: -3px; bottom: -2px; min-width: 15px; height: 15px; padding: 0 4px; border-radius: 8px; background: var(--lamp); color: #fff; font-size: 10px; font-weight: 700; line-height: 15px; text-align: center; }
  .infobar { height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 16px; font-size: 13px; color: var(--chrome-text); border-bottom: 1px solid var(--chrome-line); flex: none; }
  .infobar svg { width: 18px; height: 18px; color: #1a73e8; }
  .infobar button { margin-left: auto; font: inherit; font-weight: 500; color: #1a73e8; background: #fff; border: 1px solid var(--chrome-line); border-radius: 16px; padding: 4px 16px; }
  .body { flex: 1; display: flex; min-height: 0; }
  .page { flex: 1; min-width: 0; overflow: hidden; position: relative; }
  .side { width: 380px; flex: none; border-left: 1px solid var(--chrome-line); display: flex; flex-direction: column; }
  .side-head { height: 38px; display: flex; align-items: center; gap: 8px; padding: 0 12px; font-size: 12.5px; color: var(--chrome-text); border-bottom: 1px solid var(--chrome-line); flex: none; }
  .side-head img { width: 15px; height: 15px; }
  .side-head .x { margin-left: auto; color: var(--chrome-muted); font-size: 16px; }
  .side iframe { flex: 1; width: 100%; border: 0; display: block; }

  /* Example Mail */
  .mail { display: flex; height: 100%; font-size: 13.5px; }
  .mail aside { width: 190px; padding: 18px 14px; background: #f7f8fa; flex: none; }
  .mail aside b { display: block; font-size: 16px; margin: 0 8px 16px; color: #1d4ed8; }
  .mail aside div { padding: 7px 10px; border-radius: 8px; color: #3c4043; display: flex; }
  .mail aside div.on { background: #dbe6fe; font-weight: 600; color: #1e3a8a; }
  .mail aside div em { margin-left: auto; font-style: normal; }
  .mail section { flex: 1; min-width: 0; }
  .mail h2 { margin: 0; padding: 16px 22px 12px; font-size: 19px; font-weight: 600; }
  .row { display: grid; grid-template-columns: 170px 1fr 70px; gap: 14px; padding: 11px 22px; border-top: 1px solid #eef0f2; color: #3c4043; white-space: nowrap; }
  .row > * { overflow: hidden; text-overflow: ellipsis; }
  .row.new { color: #111; font-weight: 600; }
  .row .snip { font-weight: 400; color: #6b7075; }
  .row time { text-align: right; font-size: 12px; }

  /* Example Sheets */
  .sheet { font-size: 13px; height: 100%; }
  .sheet header { padding: 14px 18px 10px; display: flex; align-items: baseline; gap: 12px; }
  .sheet header b { font-size: 18px; font-weight: 600; }
  .sheet header span { color: #6b7075; font-size: 12.5px; }
  .sheet table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  .sheet th, .sheet td { border: 1px solid #e3e5e8; padding: 6px 10px; text-align: right; white-space: nowrap; }
  .sheet th { background: #f3f4f6; color: #5f6368; font-weight: 500; font-size: 12px; text-align: center; }
  .sheet td:first-child, .sheet th:first-child { text-align: center; color: #5f6368; background: #f3f4f6; width: 38px; }
  .sheet td:nth-child(2) { text-align: left; }
  .sheet tr.bold td { font-weight: 600; }
  .sheet td.pick { outline: 2px solid #1a73e8; outline-offset: -2px; background: #e8f0fe; }

  /* The Tallylamp dashboard's approval page, from dashboard/app.js pairView. */
  .dash { height: 100%; display: flex; flex-direction: column; }
  .dash > header { height: 52px; display: flex; align-items: center; gap: 22px; padding: 0 26px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--muted); flex: none; }
  .dash > header b { display: flex; align-items: center; gap: 7px; font-size: 15px; color: var(--text); margin-right: 10px; }
  .dash > header img { width: 18px; }
  .pair { padding: 26px 34px; max-width: 560px; display: flex; flex-direction: column; gap: 14px; }
  .pair h2 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.015em; }
  .pair p { margin: 0; color: var(--muted); font-size: 13.5px; }
  .pair .code { font: 600 30px/1 "Geist Mono", ui-monospace, Menlo, monospace; letter-spacing: 0.08em; text-align: center; padding: 16px; border: 1px solid var(--line); border-radius: 8px; background: #f5f4f2; }
  .pair dl { display: grid; grid-template-columns: 110px 1fr; gap: 5px 10px; margin: 0; font-size: 13px; }
  .pair dt { color: var(--muted); }
  .pair dd { margin: 0; }
  .pair .grant { border: 1px solid var(--line); border-radius: 8px; padding: 11px 14px; font-size: 13px; }
  .pair .grant b { display: block; margin-bottom: 3px; }
  .pair .pick { display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; }
  .pair .pick label { display: flex; gap: 8px; align-items: center; }
  .pair .pick input { accent-color: #1c1a19; width: 15px; height: 15px; margin: 0; }
  .pair .actions { display: flex; gap: 8px; }
  .pair .actions span { padding: 9px 16px; border-radius: 6px; border: 1px solid #8d8986; font-weight: 500; font-size: 13.5px; }
  .pair .actions span.go { background: #1c1a19; color: #faf9f8; border-color: #1c1a19; }

  /* Promo tiles: the mark and the name. The store asks for no other text on them. */
  body.tile { background: #191818; color: #f4f2f0; overflow: hidden; }
  body.tile.small { width: 440px; height: 280px; }
  body.tile.marquee { width: 1400px; height: 560px; }
  .lockup { display: flex; align-items: center; gap: 18px; }
  .lockup img { display: block; }
  .lockup b { font-weight: 650; letter-spacing: -0.03em; }
  body.small .lockup { position: absolute; inset: 0; justify-content: center; flex-direction: column; gap: 16px; }
  body.small .lockup img { width: 92px; height: 92px; }
  body.small .lockup b { font-size: 30px; }
  body.marquee .lockup { position: absolute; left: 110px; top: 50%; transform: translateY(-50%); flex-direction: column; align-items: flex-start; gap: 26px; }
  body.marquee .lockup img { width: 96px; height: 96px; }
  body.marquee .lockup b { font-size: 60px; line-height: 1; }
  body.marquee .lockup p { margin: -8px 0 0; font-size: 24px; color: #a9a5a1; line-height: 1.4; }
  body.marquee .panel { position: absolute; right: 120px; top: 50%; transform: translateY(-50%); width: 380px; height: 440px; border-radius: 12px; overflow: hidden; box-shadow: 0 0 0 1px #343333, 0 30px 80px rgba(0,0,0,.5); }
  body.marquee .panel iframe { width: 100%; height: 100%; border: 0; display: block; }

  body.icon { width: 128px; height: 128px; background: transparent; }
  body.icon img { position: absolute; left: 16px; top: 16px; width: 96px; height: 96px; }
</style>
</head>
<body>
<script>
const q = new URLSearchParams(location.search);
const MARK = "../extension/icons/mark.svg";
const panel = (demo, extra = "") => `../extension/panel.html?demo=${demo}${extra}`;

const TABS = {
  mail: { title: "Inbox (3) · Example Mail", fav: ["M", "#1d4ed8"], url: ["mail.example.com", "/inbox"] },
  sheet: { title: "Q3 forecast · Sheets", fav: ["S", "#188038"], url: ["sheets.example.com", "/d/1"] },
  travel: { title: "Flights to Lisbon · Example Travel", fav: ["T", "#c2410c"], url: ["travel.example.com", "/flights"] },
  pair: { title: "Link a browser · Tallylamp", fav: ["", ""], url: ["tallylamp.example.com", "/pair?code=KXQ7-M2PD"] },
};

// Captions went through the same editing passes as the listing. Keep them one claim each.
const SHOTS = {
  share: {
    title: "Share one tab with your agent.",
    sub: "Keep the rest of your browser to yourself. The agent stays on this site unless you untick the box.",
    demo: panel("ready"), tabs: [["mail"], ["sheet"], ["travel"]], on: "mail", page: "mail",
  },
  shared: {
    title: "You can always see what's shared.",
    sub: "Chrome's debugging bar, an orange tab group and a count on the icon all show it. One click takes the tab back.",
    demo: panel("shared-here"), tabs: [["mail", true], ["sheet"], ["travel"]], on: "mail", page: "mail", live: 1,
  },
  pair: {
    title: "Connect by approving a code.",
    sub: "Check it matches in your own Tallylamp dashboard, then approve. There are no keys to paste.",
    demo: panel("pairing"), tabs: [["mail"], ["pair"]], on: "pair", page: "pair",
  },
  sites: {
    title: "Keep a tab on one site, or let it roam.",
    sub: "Every shared tab says how far it can go. Stop one, or all of them at once.",
    demo: panel("shared-elsewhere", "&tab=2"), tabs: [["mail"], ["sheet", true], ["travel", true]], on: "sheet", page: "sheet", live: 2,
  },
  handback: {
    title: "If your server goes quiet, you get your tabs back.",
    sub: "After a minute without it, the extension hands back every shared tab by itself.",
    demo: panel("offline"), tabs: [["mail"], ["sheet", true], ["travel", true]], on: "sheet", page: "sheet", live: 2,
  },
};

const PAGES = {
  mail: () => `<div class="mail"><aside><b>Example Mail</b>
      <div class="on">Inbox<em>3</em></div><div>Starred</div><div>Sent</div><div>Drafts</div><div>Archive</div></aside>
    <section><h2>Inbox</h2>
      ${[
        [1, "Priya Natarajan", "Invoice #4471 for September", "Attached is the invoice for September. Payment terms are 30 days as usual.", "09:42"],
        [1, "Lisbon Stays", "Your booking is confirmed", "Check-in from 15:00 on 14 October. Your host will message you.", "08:15"],
        [1, "Tom Okafor", "Q3 forecast: can you check row 14?", "The churn number looks off to me. Could you compare it with August?", "Yesterday"],
        [0, "Example Bank", "Your statement is ready", "Your September statement is now available to view.", "Mon"],
        [0, "Dana Whitfield", "Notes from Thursday", "Here's what we agreed: ship the pricing page first, then the docs.", "Mon"],
        [0, "Rosa Lindqvist", "Re: Conference talk", "Thanks! The slot on the 21st works for us. I'll send the details.", "Sun"],
        [0, "Example Travel", "Price drop on your saved route", "Flights to Lisbon are cheaper than when you last looked.", "Sat"],
        [0, "Sam Ortega", "Lunch next week?", "Tuesday or Wednesday both work for me. Your pick.", "Fri"],
      ].map(([n, who, subj, snip, when]) => `<div class="row${n ? " new" : ""}"><span>${who}</span><span>${subj} <span class="snip">· ${snip}</span></span><time>${when}</time></div>`).join("")}
    </section></div>`,
  sheet: () => {
    const rows = [["", "Month", "Revenue", "New", "Churned", "Net"], ["", "July", "84,210", "312", "97", "215"], ["", "August", "88,940", "298", "104", "194"],
      ["", "September", "91,380", "341", "88", "253"], ["", "", "", "", "", ""], ["", "Q3 total", "264,530", "951", "289", "662"],
      ["", "", "", "", "", ""], ["", "Target", "270,000", "1,000", "250", "750"], ["", "Gap", "-5,470", "-49", "+39", "-88"]];
    return `<div class="sheet"><header><b>Q3 forecast</b><span>Edited 2 minutes ago</span></header><table>
      <tr>${["", "A", "B", "C", "D", "E"].map(c => `<th>${c}</th>`).join("")}</tr>
      ${rows.map((r, i) => `<tr class="${i === 0 || i === 5 ? "bold" : ""}">${r.map((c, j) => `<td class="${i === 5 && j === 4 ? "pick" : ""}">${j === 0 ? i + 1 : c}</td>`).join("")}</tr>`).join("")}
      ${Array.from({ length: 8 }, (_, i) => `<tr>${Array.from({ length: 6 }, (_, j) => `<td>${j === 0 ? i + 10 : "&nbsp;"}</td>`).join("")}</tr>`).join("")}
    </table></div>`;
  },
  pair: () => `<div class="dash"><header><b><img src="${MARK}" alt="">Tallylamp</b><span>Browsers</span><span>Agents</span><span>Saved profiles</span></header>
    <div class="pair">
      <h2>Link this browser?</h2>
      <p>Check this code matches the one in the extension. If you didn't just press Connect there, deny it.</p>
      <div class="code">KXQ7-M2PD</div>
      <dl><dt>Browser</dt><dd>Chrome on macOS</dd><dt>Asking from</dt><dd>203.0.113.24</dd><dt>Asked</dt><dd>just now</dd></dl>
      <div class="pick"><b>Which agents may use it</b>
        <label><input type="checkbox" checked>Research agent</label><label><input type="checkbox">Inbox helper</label></div>
      <div class="actions"><span class="go">Approve and link</span><span>Deny</span></div>
    </div></div>`,
};

const icon = (d) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const BACK = icon('<path d="M19 12H5M11 18l-6-6 6-6"/>');
const FWD = icon('<path d="M5 12h14M13 6l6 6-6 6"/>');
const RELOAD = icon('<path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6"/>');
const INFO = icon('<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>');

function tabHtml([key, grouped], on) {
  const t = TABS[key];
  const fav = t.fav[0] ? `<i class="fav" style="background:${t.fav[1]}">${t.fav[0]}</i>` : `<img class="fav" src="${MARK}" alt="">`;
  return `<div class="tab${key === on ? " on" : ""}${grouped ? " grouped" : ""}">${fav}<span>${t.title}</span></div>`;
}

function shot(s) {
  document.body.className = "shot";
  const on = TABS[s.on];
  // Chrome puts the group's name before its first tab.
  let chipDone = false;
  const strip = s.tabs.map((t) => (t[1] && !chipDone && (chipDone = true) ? `<span class="chip">Tallylamp</span>` : "") + tabHtml(t, s.on)).join("");
  document.body.innerHTML = `
    <div class="caption"><h1>${s.title}</h1><p>${s.sub}</p></div>
    <div class="brand"><img src="${MARK}" alt="">Tallylamp Link</div>
    <div class="window">
      <div class="strip"><span class="dots"><i></i><i></i><i></i></span>${strip}</div>
      <div class="toolbar">${BACK}${FWD}${RELOAD}<div class="omni">${on.url[0]}<b>${on.url[1]}</b></div>
        <span class="ext"><img src="${MARK}" alt="">${s.live ? `<span class="badge">${s.live}</span>` : ""}</span></div>
      ${s.live ? `<div class="infobar">${INFO}<span>“Tallylamp Link” started debugging this browser</span><button>Cancel</button></div>` : ""}
      <div class="body"><div class="page">${PAGES[s.page]()}</div>
        <div class="side"><div class="side-head"><img src="${MARK}" alt="">Tallylamp Link ▾<span class="x">×</span></div><iframe src="${s.demo}"></iframe></div></div>
    </div>`;
}

function tile(kind) {
  document.body.className = `tile ${kind}`;
  const mark = `<img src="${MARK}" alt="">`;
  document.body.innerHTML = kind === "small"
    ? `<div class="lockup">${mark}<b>Tallylamp Link</b></div>`
    : `<div class="lockup">${mark}<b>Tallylamp Link</b><p>Share one tab with your AI agent.<br>Take it back in one click.</p></div>
       <div class="panel"><iframe src="${panel("shared-elsewhere", "&tab=2")}"></iframe></div>`;
}

if (q.has("shot")) shot(SHOTS[q.get("shot")]);
else if (q.has("tile")) tile(q.get("tile"));
else { document.body.className = "icon"; document.body.innerHTML = `<img src="${MARK}" alt="">`; }

// Ready once every frame has loaded and drawn, with animations stopped where they would leave
// a half-faded dot in a still image. The script waits for this before it takes the picture.
(async () => {
  await Promise.all([...document.querySelectorAll("iframe")].map((f) => new Promise((r) => f.addEventListener("load", r, { once: true }))));
  for (const f of document.querySelectorAll("iframe")) {
    const style = f.contentDocument.createElement("style");
    style.textContent = "*, *::before, *::after { animation: none !important; transition: none !important; }";
    f.contentDocument.head.append(style);
  }
  await Promise.all([...document.images].map((i) => i.decode().catch(() => {})));
  await document.fonts.ready;
  await new Promise((r) => setTimeout(r, 250));
  window.stageReady = true;
})();
</script>
</body>
</html>
