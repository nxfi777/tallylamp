<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tallylamp</title>
    <!--
      Geist ships with the dashboard (see @font-face in app.css). Tallylamp is meant to run as a
      container that may have no egress at all, and the old Google Fonts link either never
      arrived there or swapped the face in late. Preloaded so the text paints in Geist at once.
    -->
    <link rel="preload" href="/fonts/geist.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/app.css" />
    <!--
      Blocking and inline on purpose. app.js is a module, so it runs after the document has
      parsed and painted — setting the theme there means every load flashes the wrong one first.
      This is the only script that has to run before the first paint.
    -->
    <script>
      try {
        var t = localStorage.getItem("tallylamp-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {
        /* private mode, or storage disabled: fall through to the system preference */
      }
    </script>
    <!-- Rounded backgrounds keep the lamp legible on both browser tab themes. -->
    <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon-light.svg" />
    <link rel="icon" type="image/svg+xml" sizes="any" media="(prefers-color-scheme: dark)" href="/favicon-dark.svg" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
